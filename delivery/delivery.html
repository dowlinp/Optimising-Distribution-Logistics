
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.3/dist/leaflet.css">

    <script type="importmap">
        {
            "imports": {
                "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.3/dist/leaflet.js"
            }
        }
    </script>

    <title>Delivery Map</title>

    <style>

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .menu {
            position: fixed;
            top: 5%;
            left: 5%;
            width: 50px;
            height: 50px;
            border-radius: 10%;
            font-size: 25px;
            cursor: pointer;
            background: white;
            color: black;
            border: 2px solid black;
            z-index: 500;
        }

        .menu:hover {
            background: black;
            color: white;
        }

        .close-menu {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            font-size: 25px;
            cursor: pointer;
            background: white;
            color: black;
            border: 1px solid black;
            border-radius: 5px;
        }

        .side-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: white;
            border-right: 2px solid black;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;

            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .side-panel.open {
            transform: translateX(0);
        }

        .side-panel a {
            display: block;
            padding: 15px;
            color: black;
            text-decoration: none;
            border-bottom: 1px solid #ddd;
        }

        .side-panel a:hover {
            background: black;
            color: white;
        }

    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Map and route -->
    <script type="module">

        import {
            LeafletMap,
            TileLayer,
            GeoJSON
        } from 'leaflet';

        // Create map
        const map = new LeafletMap('map')
            .setView([53.33333, -6.24889], 11);

        // Add OpenStreetMap background
        new TileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }
        ).addTo(map);


        // Load delivery route
        async function loadDeliveryRoute() {

            try {

                console.log("Loading delivery route...");

                const response = await fetch(
                    "/routes/order_123.geojson"
                );

                if (!response.ok) {
                    throw new Error(
                        "Could not load route: " + response.status
                    );
                }

                const data = await response.json();

                // Add GeoJSON to map
                const routeLayer = new GeoJSON(data, {

                    style: function(feature) {

                        return {
                            color: "blue",
                            weight: 5,
                            opacity: 0.9
                        };

                    }

                });

                routeLayer.addTo(map);

                // Zoom to route
                if (routeLayer.getLayers().length > 0) {

                    map.fitBounds(
                        routeLayer.getBounds(),
                        { padding: [40, 40] }
                    );

                    console.log("Delivery route loaded!");

                } else {

                    console.warn("GeoJSON contains no route features.");

                }

            } catch (error) {

                console.error(
                    "Failed to load delivery route:",
                    error
                );

            }

        }

        // Load route when page opens
        loadDeliveryRoute();

    </script>


    <!-- Menu -->
    <button id="menu" class="menu" onclick="togglePanel()">
        ☰
    </button>

    <div id="sidePanel" class="side-panel">

        <button class="close-menu" onclick="togglePanel()">
            &times;
        </button>

        <h2>Menu</h2>

        <a href="/">Home</a>
        <a href="/User">User</a>
        <a href="/Warehouse">Warehouse</a>
        <a href="/Delivery">Delivery</a>

    </div>


    <script>

        function togglePanel() {

            document.getElementById("sidePanel")
                .classList.toggle("open");

        }

    </script>

</body>
</html>
