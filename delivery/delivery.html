<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.3/dist/leaflet.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.3/dist/leaflet.js"}}
	</script>
    <title>Thin Slice Implementation</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; text-align: center; }
    button { padding: 10px 20px; margin: 6px; font-size: 16px; cursor: pointer; }
    #output { margin-top: 20px; font-size: 20px; }
    #map {
      height: 400px;
      width: 100%;
      margin-top: 290px; /* Pushes the map below the 200px tall buttons */
    }
    .fab-group {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      gap: 10px;
    }
    .fab {
      width: 200px;
      height: 200px;
      border-radius: 10%;          
      font-size: 108px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
    }
    .fab:hover { background: #000000; color: #ffffff;}
        .menu {
      position: fixed;
      top: 5%;
      left: 5%;
      width: 50px;
      height: 50px;
      border-radius: 10%;
      font-size: 25px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }

    .menu:hover {
      background: #000000;
      color: #ffffff;
    }
.close-menu {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 40px;
    height: 40px;
    font-size: 25px;
    cursor: pointer;
    background: white;
    color: black;
    border: 1px solid black;
    border-radius: 5px;
}
    .side-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: white;
    border-right: 2px solid black;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1000;

    transform: translateX(-100%);
    transition: transform 0.3s ease;
}

.side-panel.open {
    transform: translateX(0);
}

.side-panel a {
    display: block;
    padding: 15px;
    color: black;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
}

.side-panel a:hover {
    background: black;
    color: white;
}
  </style>
</head>
<body>
    <div id="map" style="height: 400px"></div>
	<script type="module">
		import {LeafletMap, TileLayer} from 'leaflet';
        const map = new LeafletMap('map').setView([53.33333, -6.24889], 11);
        new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    </script>
    <p id="output">Click a floating button...</p>
 
    <div class="fab-group">
      <button class="fab" onclick="show('Plus clicked')">+</button>
      <button class="fab" onclick="show('Settings clicked')">&#9881;</button>
      <button class="fab" onclick="show('Warning clicked')">&#9888;</button>
      <button class="fab" onclick="show('Minus clicked')">-</button>
    </div>
 
  <script>
    function togglePanel() {
    document.getElementById("sidePanel").classList.toggle("open");
}
    function show(text) {
      document.getElementById("output").textContent = text;
    }
  </script>
  <button id="menu" class="menu" onclick="togglePanel()">
    ☰
</button>

<div id="sidePanel" class="side-panel">

    <button class="close-menu" onclick="togglePanel()">
        &times;
    </button>

    <h2>Menu</h2>

    <a href="/">Home</a>
    <a href="/User">User</a>
    <a href="/Warehouse">Warehouse</a>
    <a href="/Delivery">Delivery</a>

</div>
</body>
</html>
