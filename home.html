
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }

    .fab {
      width: 200px;
      height: 200px;
      border-radius: 10%;
      font-size: 108px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }

    .fab:hover {
      background: #000000;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <button class="fab" onclick="window.location.href='http://127.0.0.1:5000/User'">
    ☺
  </button>

  <button class="fab" onclick="window.location.href='http://127.0.0.1:5000/Delivery'">
    ⛟
  </button>

  <button class="fab" onclick="window.location.href='http://127.0.0.1:5000/Warehouse'">
    &#9633;
  </button>

</body>
</html>
