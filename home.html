
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }

    .fab {
      width: 200px;
      height: 200px;
      border-radius: 10%;
      font-size: 108px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }

    .fab:hover {
      background: #000000;
      color: #ffffff;
    }

    .menu {
      position: fixed;
      top: 5%;
      left: 5%;
      width: 50px;
      height: 50px;
      border-radius: 10%;
      font-size: 25px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }

    .menu:hover {
      background: #000000;
      color: #ffffff;
    }
.close-menu {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 40px;
    height: 40px;
    font-size: 25px;
    cursor: pointer;
    background: white;
    color: black;
    border: 1px solid black;
    border-radius: 5px;
}
    .side-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: white;
    border-right: 2px solid black;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1000;

    transform: translateX(-100%);
    transition: transform 0.3s ease;
}

.side-panel.open {
    transform: translateX(0);
}

.side-panel a {
    display: block;
    padding: 15px;
    color: black;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
}

.side-panel a:hover {
    background: black;
    color: white;
}

</head>
<script>
    function togglePanel() {
        document.getElementById("sidePanel").classList.toggle("open");
    }
</script>
<body>

  <button class="fab" onclick="window.location.href='http://127.0.0.1:5000/User'">
    ☺
  </button>

  <button class="fab" onclick="window.location.href='http://127.0.0.1:5000/Delivery'">
    ⛟
  </button>

  <button class="fab" onclick="window.location.href='http://127.0.0.1:5000/Warehouse'">
    &#9636;
  </button>

<button id="menu" class="menu" onclick="togglePanel()">
    ☰
</button>

<div id="sidePanel" class="side-panel">

    <button class="close-menu" onclick="togglePanel()">
        &times;
    </button>

    <h2>Menu</h2>

    <a href="/">Home</a>
    <a href="/User">User</a>
    <a href="/Warehouse">Warehouse</a>
    <a href="/Delivery">Delivery</a>

</div>
