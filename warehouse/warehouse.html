<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	
    <title>Thin Slice Implementation</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; text-align: center; }
    button { padding: 10px 20px; margin: 6px; font-size: 16px; cursor: pointer; }
    #output { margin-top: 20px; font-size: 20px; }

    .fab-group {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column; /* Stacks the rows vertically */
      gap: 10px;
      z-index: 1000;
    }
    .fab-row {
      display: flex;
      flex-direction: row; /* Keeps buttons side-by-side inside each row */
      gap: 10px;
    }
    .fab {
      width: 200px;
      height: 200px;
      border-radius: 10%;          
      font-size: 108px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
    }
    .fab:hover { background: #000000; color: #ffffff;}
    
        .menu {
      position: fixed;
      top: 5%;
      left: 5%;
      width: 50px;
      height: 50px;
      border-radius: 10%;
      font-size: 25px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }

    .menu:hover {
      background: #000000;
      color: #ffffff;
    }
.close-menu {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 40px;
    height: 40px;
    font-size: 25px;
    cursor: pointer;
    background: white;
    color: black;
    border: 1px solid black;
    border-radius: 5px;
}
    .side-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: white;
    border-right: 2px solid black;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1000;

    transform: translateX(-100%);
    transition: transform 0.3s ease;
}

.side-panel.open {
    transform: translateX(0);
}

.side-panel a {
    display: block;
    padding: 15px;
    color: black;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
}

.side-panel a:hover {
    background: black;
    color: white;
}
  </style>
</head>

<body>
    
    <div class="fab-group">
      <div class="fab-row">
        <button class="fab" onclick="show('White King clicked')">&#9812;</button>
        <button class="fab" onclick="show('White Queen clicked')">&#9813;</button>
        <button class="fab" onclick="show('White Rook clicked')">&#9814;</button>
        <button class="fab" onclick="show('Bishop clicked')">&#9815;</button>
        <button class="fab" onclick="show('White Knight clicked')">&#9816;</button>
        <button class="fab" onclick="show('White Pawn clicked')">&#9817;</button>
        </div>
      <div class="fab-row">
        <button class="fab" onclick="show('Black King clicked')">&#9818;</button>
        <button class="fab" onclick="show('Black Queen clicked')">&#9819;</button>
        <button class="fab" onclick="show('Black Rook clicked')">&#9820;</button>
        <button class="fab" onclick="show('Bishop clicked')">&#9821;</button>
        <button class="fab" onclick="show('Black Knight clicked')">&#9822;</button>
        <button class="fab" onclick="show('Black Pawn clicked')">&#9823;</button>
      </div>
    </div>

  <script>
    function togglePanel() {
    document.getElementById("sidePanel").classList.toggle("open");
}
    function show(text) {
      document.getElementById("output").textContent = text;
    }
  </script>
  <button id="menu" class="menu" onclick="togglePanel()">
    ☰
</button>

<div id="sidePanel" class="side-panel">

    <button class="close-menu" onclick="togglePanel()">
        &times;
    </button>

    <h2>Menu</h2>

    <a href="/">Home</a>
    <a href="/User">User</a>
    <a href="/Warehouse">Warehouse</a>
    <a href="/Delivery">Delivery</a>

</div>
</body>
</html>
